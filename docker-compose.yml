version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: abcde-postgres
    environment:
      POSTGRES_DB: trace_compliance_master
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: changeme
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: abcde-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
